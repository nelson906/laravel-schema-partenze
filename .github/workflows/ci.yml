name: CI

# Suite di test automatica (laravel-schema-partenze).
# I test PHP usano RefreshDatabase su sqlite :memory: (vedi phpunit.xml): sono
# self-contained, creano schema e dati con le factory. Niente MySQL né dump.
# I test JS girano con Vitest. Gli asset Vite vengono buildati perché i Feature
# test rendono view che usano @vite (layouts/app.blade.php).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        # Allineato a MAMP 8.5 / Aruba. composer.lock risolto su 8.5.
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, fileinfo, bcmath, intl, gd, zip, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build front-end assets
        # I Feature test rendono view con @vite: senza public/build/manifest.json
        # lancerebbero "Vite manifest not found".
        run: npm run build

      - name: Run JS tests (Vitest)
        run: npm run test

      - name: Run PHP tests (PHPUnit, sqlite :memory:)
        run: php artisan test
